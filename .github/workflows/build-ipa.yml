name: Build Telegram + AyuGram (Sideloadly Ready)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL к IPA (по умолчанию свежий AyuGram iOS)'
        required: false
        default: 'https://github.com/mapix3/AyuGram-iOS/releases/download/build-207501/AyuGram-standard-207501.ipa'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Base IPA
        run: |
          echo "Скачиваем IPA по ссылке: ${{ inputs.ipa_url }}"
          curl -L -o base.ipa "${{ inputs.ipa_url }}"
          unzip -q base.ipa -d app_extracted

      - name: Optimize for Sideloadly
        run: |
          APP_PATH=$(find app_extracted/Payload -maxdepth 1 -name "*.app")
          echo "Найдено приложение: $APP_PATH"

          # 1. Удаляем расширения, чтобы бесплатный Apple ID в Sideloadly не выдавал ошибку "Max number of App IDs reached"
          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "Удаляем PlugIns для совместимости с бесплатным Apple ID..."
            rm -rf "$APP_PATH/PlugIns"
          fi
          if [ -d "$APP_PATH/Watch" ]; then
            rm -rf "$APP_PATH/Watch"
          fi

          # 2. Пакуем готовый к установке IPA
          cd app_extracted
          zip -qr ../Telegram_AyuGram_Sideloadly.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram_AyuGram_Sideloadly
          path: Telegram_AyuGram_Sideloadly.ipa
          retention-days: 14
